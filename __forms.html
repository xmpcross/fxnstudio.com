<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Netlify Forms</title>
  </head>
  <body>
    <form name="contact" method="POST" action="/__forms.html" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact">
      <input type="hidden" name="subject" value="[fxnstudio.com] Contact form">
      <input type="text" name="first-name">
      <input type="text" name="last-name">
      <input type="email" name="your-email">
      <input type="url" name="your-website">
      <select name="contact-type">
        <option value="Project">New Project</option>
      </select>
      <textarea name="your-message"></textarea>
      <input name="bot-field">
    </form>

    <form name="project-brief" method="POST" action="/__forms.html" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="project-brief">
      <input type="hidden" name="subject" value="[fxnstudio.com] Project brief">
      <input type="hidden" name="brief-source">
      <input type="text" name="first-name">
      <input type="text" name="last-name">
      <input type="email" name="your-email">
      <input type="url" name="your-website">
      <select name="project-type">
        <option value="New website">New website</option>
      </select>
      <select name="project-budget">
        <option value="">Select range</option>
      </select>
      <select name="project-timeline">
        <option value="">Select timeline</option>
      </select>
      <textarea name="project-goal"></textarea>
      <textarea name="project-pages"></textarea>
      <textarea name="project-audience"></textarea>
      <textarea name="project-inspiration"></textarea>
      <textarea name="your-message"></textarea>
      <input name="bot-field">
    </form>
  </body>
</html>
